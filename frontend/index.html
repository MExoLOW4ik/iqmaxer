<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>iQmaxer — Learn with a friendly tutor</title>
<style>
/* ========== RESET & BASE ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(99,102,241,0.10), transparent),
    radial-gradient(1000px 500px at -10% 110%, rgba(20,184,166,0.08), transparent),
    #141627;
  color:#e8e9f3;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.55;
}
a{color:#7c83ff;text-decoration:none}
a:hover{color:#a5acff}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2d45;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#3a3e5e}

/* ========== GLASS CARD ========== */
.glass{
  background:rgba(30,33,56,0.82);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(124,131,255,0.12);
  border-radius:18px;
  padding:20px;
  transition:all .25s ease;
}
.glass:hover{border-color:rgba(124,131,255,0.28);box-shadow:0 8px 30px rgba(99,102,241,0.10)}

/* ========== RANK BADGES ========== */
.rank-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:8px;
  font-weight:800;font-size:.8rem;
  text-shadow:0 0 8px currentColor;
  flex-shrink:0;
}
.rank-badge.sm{width:24px;height:24px;font-size:.65rem;border-radius:5px}
.rank-badge.lg{width:48px;height:48px;font-size:1.2rem;border-radius:12px}
.rank-badge.xl{width:72px;height:72px;font-size:1.8rem;border-radius:16px}
.rank-E{background:rgba(136,136,136,0.2);color:#888;border:1px solid rgba(136,136,136,0.4)}
.rank-D{background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.4)}
.rank-C{background:rgba(96,165,250,0.15);color:#60a5fa;border:1px solid rgba(96,165,250,0.4)}
.rank-B{background:rgba(167,139,250,0.15);color:#a78bfa;border:1px solid rgba(167,139,250,0.4)}
.rank-A{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.4)}
.rank-S{background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.5);box-shadow:0 0 20px rgba(239,68,68,0.2)}

/* ========== BUTTONS ========== */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 24px;border-radius:10px;border:none;
  font-weight:600;font-size:.9rem;font-family:inherit;
  cursor:pointer;transition:all .3s ease;
}
.btn-primary{
  background:linear-gradient(135deg,#6366f1,#14b8a6);
  color:#fff;box-shadow:0 6px 18px rgba(99,102,241,0.28);
}
.btn-primary:hover{
  box-shadow:0 10px 26px rgba(99,102,241,0.42);
  transform:translateY(-2px);
}
.btn-primary:active{transform:translateY(0)}
.btn-outline{
  background:transparent;color:#7c83ff;border:1px solid rgba(124,131,255,0.55);
}
.btn-outline:hover{background:rgba(124,131,255,0.12)}
.btn-ghost{
  background:transparent;color:#9a9db5;border:1px solid rgba(124,131,255,0.15);
}
.btn-ghost:hover{color:#e8e9f3;border-color:rgba(124,131,255,0.3)}

/* ========== XP BAR ========== */
.xp-bar-wrap{
  width:100%;height:12px;background:rgba(124,131,255,0.12);border-radius:99px;
  overflow:hidden;position:relative;
}
.xp-bar-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#6366f1,#14b8a6,#5eead4);
  border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.xp-bar-fill::after{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  animation:xpShimmer 2s ease-in-out infinite;
}
@keyframes xpShimmer{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}

/* ========== HUD / TOP BAR ========== */
.hud{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;background:rgba(10,10,26,0.95);
  border-bottom:1px solid #1a1a3e;position:sticky;top:0;z-index:100;
  backdrop-filter:blur(12px);
}
.hud-left{display:flex;align-items:center;gap:16px}
.hud-right{display:flex;align-items:center;gap:12px}
.hud-level{
  font-weight:800;font-size:1.2rem;color:#7c83ff;
}
.hud-title{font-size:.8rem;color:#888}
.hud-streak{display:flex;align-items:center;gap:4px;color:#fbbf24;font-weight:600;font-size:.85rem}
.nav-icon{
  background:none;border:none;color:#888;font-size:1.3rem;cursor:pointer;
  padding:6px;border-radius:8px;transition:all .2s;
}
.nav-icon:hover{color:#48cae4;background:rgba(0,180,216,0.1)}
.nav-icon.active{color:#00b4d8}

/* ========== LAYOUT ========== */
.app-container{max-width:1100px;margin:0 auto;padding:20px 16px 80px}

.section-title{
  font-size:1.3rem;font-weight:700;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.section-title .icon{font-size:1.2rem}

/* ========== DASHBOARD ========== */
.player-card{
  display:flex;align-items:center;gap:20px;
  padding:24px;margin-bottom:24px;
}
.player-info{flex:1}
.player-name{font-size:1.5rem;font-weight:700;margin-bottom:4px}
.player-rank-line{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.player-title{color:#888;font-size:.85rem;text-transform:uppercase;letter-spacing:1px}
.xp-row{display:flex;align-items:center;gap:12px;margin-top:8px}
.xp-text{font-size:.8rem;color:#888;white-space:nowrap}
.streak-badge{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:99px;
  background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);
  color:#fbbf24;font-weight:600;font-size:.85rem;
}
.streak-fire{font-size:1.1rem}

/* ========== GOALS CARDS ========== */
.goal-card{
  padding:18px 20px;margin-bottom:12px;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;
}
.goal-card:hover{border-color:#2a2a5e;transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.goal-card-top{display:flex;align-items:center;gap:12px}
.goal-card-title{font-weight:600;font-size:.95rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-card-meta{display:flex;align-items:center;gap:16px;font-size:.8rem;color:#888}
.goal-card-progress{flex:1}
.goal-card-pct{color:#00b4d8;font-weight:600;font-size:.8rem}
.goal-card-deadline{color:#888;font-size:.75rem}
.goal-card .xp-bar-wrap{height:6px}

/* ========== DAILY QUESTS ========== */
.daily-list{display:flex;flex-direction:column;gap:8px}
.daily-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:12px;
  background:rgba(17,17,40,0.6);border:1px solid #1a1a3e;
  transition:all .3s ease;cursor:pointer;
}
.daily-item:hover{border-color:#2a2a5e}
.daily-item.completed{opacity:0.5;border-color:#2a2a5e}
.daily-item.completed .daily-title{text-decoration:line-through}
.daily-check{
  width:22px;height:22px;border-radius:6px;
  border:2px solid #1a1a3e;background:transparent;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;cursor:pointer;transition:all .3s;
  font-size:.75rem;color:transparent;
}
.daily-check.checked{
  background:linear-gradient(135deg,#0077b6,#00b4d8);
  border-color:#00b4d8;color:#fff;box-shadow:0 0 10px rgba(0,180,216,0.3);
}
.daily-info{flex:1;min-width:0}
.daily-title{font-size:.9rem;font-weight:500}
.daily-xp{font-size:.75rem;color:#888}
.daily-deadline{font-size:.7rem;color:#555}

/* ========== ACHIEVEMENTS ========== */
.achievements-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
}
.achievement-card{
  padding:16px;text-align:center;border-radius:12px;
  background:rgba(17,17,40,0.6);border:1px solid #1a1a3e;
  transition:all .3s;cursor:default;
}
.achievement-card.unlocked{border-color:#00b4d8;box-shadow:0 0 12px rgba(0,180,216,0.1)}
.achievement-card.locked{filter:grayscale(1);opacity:0.4}
.achievement-icon{font-size:2rem;margin-bottom:8px}
.achievement-name{font-size:.8rem;font-weight:600;margin-bottom:4px}
.achievement-desc{font-size:.7rem;color:#888}
.achievement-xp{font-size:.7rem;color:#00b4d8;margin-top:4px}

/* ========== GOAL DETAIL ========== */
.goal-detail-header{
  display:flex;align-items:flex-start;gap:16px;margin-bottom:24px;
}
.goal-detail-info{flex:1}
.goal-detail-title{font-size:1.4rem;font-weight:700;margin-bottom:4px}
.goal-detail-desc{color:#888;font-size:.9rem;margin-bottom:12px}
.goal-detail-meta{display:flex;flex-wrap:wrap;gap:16px;font-size:.8rem;color:#888}

.quest-group{margin-bottom:20px}
.quest-group-title{
  font-size:.85rem;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;color:#555;margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.quest-group-title .line{flex:1;height:1px;background:#1a1a3e}

/* ========== CREATE FORM ========== */
.form-group{margin-bottom:16px}
.form-label{
  display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:#aaa;
}
.form-input,.form-textarea,.form-select{
  width:100%;padding:12px 14px;border-radius:10px;
  background:rgba(17,17,40,0.8);border:1px solid #1a1a3e;
  color:#e0e0f0;font-family:inherit;font-size:.9rem;
  transition:border-color .3s;outline:none;
}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:#00b4d8;box-shadow:0 0 10px rgba(0,180,216,0.15)}
.form-textarea{resize:vertical;min-height:100px}
.form-select{appearance:none;-webkit-appearance:none;cursor:pointer}
.form-select option{background:#111128;color:#e0e0f0}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ========== GOALS GRID ========== */
.goals-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;
}
.goals-grid .goal-card{margin-bottom:0}

/* ========== FEED ========== */
.feed-list{display:flex;flex-direction:column;gap:8px}
.feed-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 14px;border-radius:10px;
  background:rgba(17,17,40,0.4);border-left:3px solid #1a1a3e;
  font-size:.85rem;
}
.feed-item.goal-created{border-left-color:#0077b6}
.feed-item.quest-done{border-left-color:#4ade80}
.feed-item.level-up{border-left-color:#fbbf24;background:rgba(251,191,36,0.05)}
.feed-item.achievement{border-left-color:#a78bfa}
.feed-icon{font-size:1rem;flex-shrink:0;margin-top:2px}
.feed-text{flex:1}
.feed-time{font-size:.7rem;color:#555;white-space:nowrap}

/* ========== LEVEL UP OVERLAY ========== */
.level-up-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.85);
  z-index:9999;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
.level-up-overlay.show{opacity:1;pointer-events:auto}
.level-up-text{
  font-size:5rem;font-weight:900;
  background:linear-gradient(135deg,#00b4d8,#48cae4,#e0f7fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  text-shadow:none;
  filter:drop-shadow(0 0 40px rgba(0,180,216,0.6));
  animation:levelUpPulse 1.5s ease-in-out infinite;
}
@keyframes levelUpPulse{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 40px rgba(0,180,216,0.6))}
  50%{transform:scale(1.05);filter:drop-shadow(0 0 60px rgba(0,180,216,0.9))}
}
.level-up-sub{
  font-size:1.2rem;color:#888;margin-top:8px;
}
.level-up-new-rank{
  margin-top:12px;animation:levelUpRankPop .5s ease backwards .5s;
}
@keyframes levelUpRankPop{
  0%{transform:scale(0) rotate(-20deg);opacity:0}
  70%{transform:scale(1.15) rotate(3deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.level-up-flash{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,180,216,0.15);
  pointer-events:none;z-index:9998;
  animation:flashOut .8s ease forwards;
}
@keyframes flashOut{
  0%{opacity:1}
  100%{opacity:0}
}

/* ========== SYSTEM MESSAGE ========== */
.system-msg{
  padding:14px 18px;border-radius:10px;
  background:#0d0d20;border:1px solid #00b4d8;
  color:#48cae4;font-family:'Courier New',monospace;
  font-size:.85rem;margin-bottom:16px;
  box-shadow:0 0 15px rgba(0,180,216,0.1);
  position:relative;
}
.system-msg::before{
  content:'▶';margin-right:8px;color:#00b4d8;
}

/* ========== FLOATING XP ========== */
.floating-xp{
  position:fixed;pointer-events:none;z-index:9997;
  font-weight:800;font-size:1.2rem;color:#00b4d8;
  animation:floatUp 1.2s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-80px) scale(1.3)}
}

/* ========== GREEN GLOW (quest complete) ========== */
.quest-complete-glow{
  animation:greenGlow .6s ease;
}
@keyframes greenGlow{
  0%,100%{box-shadow:0 0 0 rgba(74,222,128,0)}
  50%{box-shadow:0 0 25px rgba(74,222,128,0.4),inset 0 0 15px rgba(74,222,128,0.1)}
}

/* ========== LOADING ========== */
.loading{
  text-align:center;padding:40px;color:#555;font-size:.9rem;
}
.loading::after{
  content:'';display:inline-block;width:20px;height:20px;
  border:2px solid #1a1a3e;border-top-color:#00b4d8;
  border-radius:50%;animation:spin .8s linear infinite;
  margin-left:8px;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

.error-msg{
  text-align:center;padding:40px;color:#ef4444;font-size:.9rem;
}

/* ========== EMPTY STATE ========== */
.empty-state{
  text-align:center;padding:40px 20px;color:#555;
}
.empty-state .icon{font-size:2.5rem;margin-bottom:12px}
.empty-state .text{font-size:.9rem}

/* ========== NOTIFICATION ========== */
.notification{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  padding:12px 24px;border-radius:10px;
  background:#111128;border:1px solid #00b4d8;
  color:#e0e0f0;font-size:.85rem;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
  z-index:9996;
  animation:notifIn .3s ease;
}
@keyframes notifIn{
  0%{opacity:0;transform:translateX(-50%) translateY(20px)}
  100%{opacity:1;transform:translateX(-50%) translateY(0)}
}

/* ========== NEW SECTIONS: MATERIALS / TESTS / ASSIGNMENTS ========== */

.material-grid, .test-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.material-card, .test-card, .assign-card {
  padding: 18px 20px; margin-bottom: 0;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 8px;
}
.material-card:hover, .test-card:hover, .assign-card:hover {
  border-color: #2a2a5e; transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.material-card-studied {
  opacity: 0.6;
}
.material-card-studied .material-card-title::after {
  content: ' ✅';
  font-size: .8rem;
}
.material-card-top, .test-card-top, .assign-card-top {
  display: flex; align-items: center; gap: 12px;
}
.material-card-title, .test-card-title, .assign-card-title {
  font-weight: 600; font-size: .95rem; flex: 1;
}
.material-card-meta, .test-card-meta, .assign-card-meta {
  display: flex; align-items: center; gap: 16px; font-size: .8rem; color: #888;
}
.material-card-desc, .test-card-desc, .assign-card-desc {
  font-size: .8rem; color: #666; line-height: 1.4;
}

/* ===== STUDY BUTTON ===== */
.study-btn {
  margin-top: 8px; align-self: flex-start;
}
.study-btn:disabled {
  opacity: 0.4; cursor: not-allowed;
}

/* ===== QUIZ ===== */
.quiz-question {
  margin-bottom: 24px;
  padding: 18px 20px;
  background: rgba(17,17,40,0.6);
  border: 1px solid #1a1a3e;
  border-radius: 12px;
}
.quiz-question-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.quiz-question-number {
  font-weight: 800; font-size: .8rem;
  color: #48cae4; background: rgba(0,180,216,0.1);
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.quiz-question-text {
  font-weight: 600; font-size: .95rem; flex: 1;
}

.quiz-options {
  display: flex; flex-direction: column; gap: 8px;
}
.quiz-option {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-radius: 10px;
  background: rgba(17,17,40,0.4);
  border: 1px solid #1a1a3e;
  cursor: pointer;
  transition: all .2s;
  font-size: .9rem;
}
.quiz-option:hover {
  border-color: #2a2a5e;
  background: rgba(0,180,216,0.05);
}
.quiz-option .radio-indicator {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid #1a1a3e;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all .2s;
  font-size: .7rem; color: transparent;
}
.quiz-option.selected {
  border-color: #00b4d8;
  background: rgba(0,180,216,0.1);
}
.quiz-option.selected .radio-indicator {
  border-color: #00b4d8;
  background: #00b4d8;
  color: #fff;
}
.quiz-option.correct {
  border-color: #4ade80;
  background: rgba(74,222,128,0.1);
}
.quiz-option.correct .radio-indicator {
  border-color: #4ade80;
  background: #4ade80;
  color: #fff;
}
.quiz-option.wrong {
  border-color: #ef4444;
  background: rgba(239,68,68,0.1);
}
.quiz-option.wrong .radio-indicator {
  border-color: #ef4444;
  background: #ef4444;
  color: #fff;
}
.quiz-option.disabled {
  cursor: default; pointer-events: none;
}

/* ===== QUIZ RESULT ===== */
.quiz-result {
  text-align: center;
  padding: 24px;
  margin-bottom: 20px;
}
.quiz-result-score {
  font-size: 2.5rem; font-weight: 900;
  margin-bottom: 4px;
}
.quiz-result-score.pass { color: #4ade80; }
.quiz-result-score.fail { color: #ef4444; }
.quiz-result-label {
  font-size: 1rem; font-weight: 600; margin-bottom: 4px;
}
.quiz-result-label.pass { color: #4ade80; }
.quiz-result-label.fail { color: #ef4444; }
.quiz-result-xp {
  font-size: .9rem; color: #00b4d8; margin-top: 8px;
}
.quiz-result-detail {
  font-size: .8rem; color: #888; margin-top: 4px;
}

/* ===== ASSIGNMENT STATUS BADGE ===== */
.status-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 99px;
  font-size: .75rem; font-weight: 600;
}
.status-badge.pending {
  background: rgba(251,191,36,0.1);
  color: #fbbf24;
  border: 1px solid rgba(251,191,36,0.3);
}
.status-badge.completed {
  background: rgba(74,222,128,0.1);
  color: #4ade80;
  border: 1px solid rgba(74,222,128,0.3);
}

/* ========== AI COURSES ========== */
.course-card{
  padding:18px 20px;margin-bottom:12px;cursor:pointer;
  display:flex;flex-direction:column;gap:10px;
}
.course-card:hover{
  border-color:#2a2a5e;transform:translateY(-2px);
  box-shadow:0 4px 25px rgba(0,180,216,0.12);
}
.course-card-top{display:flex;align-items:center;gap:12px}
.course-card-title{font-weight:600;font-size:.95rem;flex:1}
.course-card-desc{font-size:.8rem;color:#666;line-height:1.4}

<script>
/* ===================================================================
   iQmaxer — friendly tutor frontend
   =================================================================== */

// ===================== STATE =====================
let state = {
  user: null,
  goals: [],
  daily: [],
  history: [],
  achievements: [],
  materials: [],
  currentMaterial: null,
  tests: [],
  currentTest: null,
  testResult: null,
  assignments: [],
  currentGoal: null,
  courses: [],
  currentCourse: null,
  currentQuest: null,
  tutorSessions: [],
  currentTutor: null,   // {id, topic, title, mastery, messages:[...]}
  tutorBusy: false,
  tutorAdvanced: false,
  loading: false,
  error: null,
};

// ===================== API =====================
const API_BASE = (() => {
  const p = window.location.pathname;
  // If served under a subpath like /iqmaxer/, detect it
  return p.replace(/\/+$/, '') + '/api';
})();

// ===================== AUTH TOKEN =====================
const TOKEN_KEY = 'iqmaxer_token';
function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }

const api = {
  async get(url, opts = {}) {
    const token = getToken();
    const r = await fetch(url, {
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
        ...opts.headers,
      },
      ...opts,
    });
    if (r.status === 401) {
      // Session expired/invalid — drop token and return to the welcome screen.
      setToken(null);
      if (!url.endsWith('/auth/me')) showWelcome();
      throw new Error('Not authenticated');
    }
    if (!r.ok) {
      const body = await r.text();
      let msg;
      try { msg = JSON.parse(body).detail || body; } catch { msg = body; }
      throw new Error(msg || `HTTP ${r.status}`);
    }
    return r.json();
  },
  // Auth
  register: data => api.get(API_BASE + '/auth/register', { method: 'POST', body: JSON.stringify(data) }),
  login: data => api.get(API_BASE + '/auth/login', { method: 'POST', body: JSON.stringify(data) }),
  logout: () => api.get(API_BASE + '/auth/logout', { method: 'POST' }),
  me: () => api.get(API_BASE + '/auth/me'),
  getUser:        () => api.get(API_BASE + '/user'),
  getGoals:       () => api.get(API_BASE + '/goals'),
  getGoal:        id => api.get(API_BASE + '/goals/' + id),
  getDaily:       () => api.get(API_BASE + '/daily'),
  getHistory:     () => api.get(API_BASE + '/history'),
  getAchievements:() => api.get(API_BASE + '/achievements'),
  createGoal:     data => api.get(API_BASE + '/goals', { method: 'POST', body: JSON.stringify(data) }),
  completeQuest:  id => api.get(API_BASE + '/quests/' + id, { method: 'PATCH', body: JSON.stringify({ completed: true }) }),
  // Materials
  getMaterials: () => api.get(API_BASE + '/materials'),
  getMaterial: id => api.get(API_BASE + '/materials/' + id),
  studyMaterial: id => api.get(API_BASE + '/materials/' + id + '/study', { method: 'POST' }),
  // Tests
  getTests: () => api.get(API_BASE + '/tests'),
  getTest: id => api.get(API_BASE + '/tests/' + id),
  submitTest: (id, answers) => api.get(API_BASE + '/tests/' + id + '/submit', { method: 'POST', body: JSON.stringify({answers}) }),
  // Assignments
  getAssignments: () => api.get(API_BASE + '/assignments'),
  completeAssignment: id => api.get(API_BASE + '/assignments/' + id + '/complete', { method: 'PATCH' }),
  // AI Courses
  getCourses: () => api.get(API_BASE + '/ai/courses'),
  getCourse: id => api.get(API_BASE + '/ai/courses/' + id),
  generateCourse: goal => api.get(API_BASE + '/ai/courses/generate', { method: 'POST', body: JSON.stringify({goal}) }),
  submitQuestAnswer: (id, answer) => api.get(API_BASE + '/ai/quests/' + id + '/answer', { method: 'POST', body: JSON.stringify({answer}) }),
  getQuestHint: id => api.get(API_BASE + '/ai/quests/' + id + '/hint', { method: 'POST' }),
  // Tutor
  getTutorSessions: () => api.get(API_BASE + '/tutor/sessions'),
  getTutorSession: id => api.get(API_BASE + '/tutor/sessions/' + id),
  startTutorSession: topic => api.get(API_BASE + '/tutor/sessions', { method: 'POST', body: JSON.stringify({topic}) }),
  sendTutorMessage: (id, content, advanced) => api.get(API_BASE + '/tutor/sessions/' + id + '/message', { method: 'POST', body: JSON.stringify({content, advanced: !!advanced}) }),
  deleteTutorSession: id => api.get(API_BASE + '/tutor/sessions/' + id, { method: 'DELETE' }),
};

// ===================== RANK HELPERS =====================
const RANK_ORDER = ['E','D','C','B','A','S'];
const RANK_TITLES = { E:'Novice', D:'Apprentice', C:'Scholar', B:'Expert', A:'Master', S:'Legend' };
const RANK_COLORS = { E:'#888', D:'#4ade80', C:'#60a5fa', B:'#a78bfa', A:'#fbbf24', S:'#ef4444' };

function getRank(xp) {
  if (xp >= 10000) return 'S';
  if (xp >= 5000)  return 'A';
  if (xp >= 2000)  return 'B';
  if (xp >= 1000)  return 'C';
  if (xp >= 300)   return 'D';
  return 'E';
}

function getLevel(xp) {
  // Each level costs: 100 * level
  let level = 1, needed = 100;
  while (xp >= needed) {
    xp -= needed;
    level++;
    needed = 100 * level;
  }
  return level;
}

function getXpProgress(xp) {
  let level = 1, needed = 100, total = xp;
  while (total >= needed) {
    total -= needed;
    level++;
    needed = 100 * level;
  }
  return { level, currentXp: total, neededXp: needed, progress: total / needed };
}

// ===================== NOTIFICATIONS =====================
function notify(msg) {
  const old = document.querySelector('.notification');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'notification';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.remove(); }, 3000);
}

// ===================== FLOATING XP =====================
function showFloatingXp(x, y, xp) {
  const el = document.createElement('div');
  el.className = 'floating-xp';
  el.textContent = `+${xp} XP`;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

// ===================== LEVEL UP OVERLAY =====================
function showLevelUp(user, oldLevel, oldRank) {
  const overlay = document.getElementById('levelUpOverlay');
  document.getElementById('levelUpSub').textContent = `Lv.${oldLevel} → Lv.${user.level}`;

  const rankEl = document.getElementById('levelUpRank');
  const r = getRank(user.xp);
  rankEl.innerHTML = `<span class="rank-badge rank-${r} xl">${r}</span>`;

  overlay.classList.add('show');

  // Flash
  const flash = document.createElement('div');
  flash.className = 'level-up-flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 900);

function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Minimal, safe markdown: escape first, then allow **bold** and line breaks.
function mdLite(str) {
  let s = escapeHtml(str);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s;
}

  } else {
    const msgs = (cur.messages || []).filter(m => m.role !== 'system');
    main = `
      <section class="tutor-main">
        <div class="tutor-head">
          <div>
            <h2>${escapeHtml(cur.title || cur.topic)}</h2>
            <div class="sub">Mastery ${cur.mastery||0}%</div>
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <label class="adv-toggle" title="Graduate-level rigor">
              <input type="checkbox" ${state.tutorAdvanced ? 'checked' : ''} onchange="state.tutorAdvanced=this.checked">
              Advanced
            </label>
            <button class="btn btn-ghost" style="padding:6px 12px" onclick="tutorDelete(${cur.id})">🗑</button>
          </div>
        </div>
        <div class="tutor-thread" id="tutorThread">
          ${msgs.map(m => m.role === 'user'
            ? `<div class="msg user">${mdLite(m.content)}</div>`
            : `<div class="msg assistant">${mdLite(m.content)}</div>`).join('')}
          ${state.tutorBusy ? '<div class="tutor-thinking"><span class="tutor-orb"></span>Thinking…</div>' : ''}
        </div>
        <div class="tutor-input-row">
          <textarea class="tutor-input" id="tutorInput" rows="1" placeholder="Type your answer or a question…"
            onkeydown="tutorKey(event)" oninput="tutorAutogrow(this)" ${state.tutorBusy ? 'disabled' : ''}></textarea>
          <button class="btn btn-primary" onclick="tutorSend()" ${state.tutorBusy ? 'disabled' : ''}>Send</button>
        </div>
      </section>`;
  }

  renderPage(`<div class="tutor-layout">${sidebar}${main}</div>`);
  tutorScrollToBottom();
  const input = document.getElementById('tutorInput');
  if (input && !state.tutorBusy) input.focus();
}

function tutorScrollToBottom() {
  const thread = document.getElementById('tutorThread');
  if (thread) thread.scrollTop = thread.scrollHeight;
}

function tutorAutogrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function tutorKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); tutorSend(); }
}

function tutorNewPrompt() {
  const topic = prompt('What would you like to learn about?');
  if (topic && topic.trim()) tutorStart(topic.trim());
}

async function tutorStart(topic) {
  if (state.tutorBusy) return;
  state.tutorBusy = true;
  state.currentTutor = { id: null, topic, title: topic, mastery: 0, messages: [] };
  renderTutorView();
  try {
    const session = await api.startTutorSession(topic);
    state.currentTutor = session;
    state.tutorSessions = await api.getTutorSessions();
  } catch (e) {
    notify('Could not start session: ' + e.message);
    state.currentTutor = null;
  } finally {
    state.tutorBusy = false;
    renderTutorView();
  }
}

async function tutorOpen(id) {
  try {
    state.currentTutor = await api.getTutorSession(id);
    renderTutorView();
  } catch (e) {
    notify('Could not open session: ' + e.message);
  }
}

async function tutorSend() {
  if (state.tutorBusy || !state.currentTutor || !state.currentTutor.id) return;
  const input = document.getElementById('tutorInput');
  const text = input ? input.value.trim() : '';
  if (!text) return;

  // Optimistically show the learner's message + typing indicator.
  state.currentTutor.messages.push({ role: 'user', content: text });
  state.tutorBusy = true;
  renderTutorView();

  try {
    const res = await api.sendTutorMessage(state.currentTutor.id, text, state.tutorAdvanced);
    state.currentTutor.messages.push({ role: 'assistant', content: res.reply });
    state.currentTutor.mastery = res.mastery;
    if (res.user) { state.user = res.user; updateHUD(); }
    if (res.level_up) showLevelUp(res.user, res.user.level - 1, getRank(res.user.xp));
    // Refresh sidebar mastery/order.
    try { state.tutorSessions = await api.getTutorSessions(); } catch {}
  } catch (e) {
    notify('Tutor error: ' + e.message);
  } finally {
    state.tutorBusy = false;
    renderTutorView();
  }
}

async function tutorDelete(id) {
  if (!confirm('Delete this learning session?')) return;
  try {
    await api.deleteTutorSession(id);
    if (state.currentTutor && state.currentTutor.id === id) state.currentTutor = null;
    state.tutorSessions = await api.getTutorSessions();
    renderTutorView();
  } catch (e) {
    notify('Could not delete: ' + e.message);
  }
}

function renderTestDetailHTML(test, result) {
  const r = getRank(test.difficulty_rank || test.xp_reward || 0);
  const questions = test.questions || [];

  let html = `
    <div style="margin-bottom:16px">
      <button class="btn btn-ghost" onclick="navigate('/tests')">← Back to Tests</button>
    </div>
    <div class="section-title">
      <span class="rank-badge rank-${r} sm">${r}</span>
      ${escapeHtml(test.title)}
    </div>
    ${test.description ? `<p style="color:#888;margin-bottom:16px;font-size:.9rem">${escapeHtml(test.description)}</p>` : ''}
    <div class="glass" style="margin-bottom:20px;display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:#888">
      <span>⭐ <strong style="color:#00b4d8">${test.xp_reward || 0} XP</strong></span>
      <span>📝 <strong style="color:#48cae4">${questions.length}</strong> questions</span>
      <span>🎯 Pass: <strong>${test.pass_percent || 70}%</strong></span>
    </div>`;

  // Result display
  if (result) {
    const passed = result.passed;
    const scorePct = questions.length > 0 ? (result.score / result.total) * 100 : 0;
    html += `
      <div class="quiz-result glass ${passed ? 'pass' : 'fail'}">
        <div class="quiz-result-score ${passed ? 'pass' : 'fail'}">${result.score}/${result.total}</div>
        <div class="quiz-result-label ${passed ? 'pass' : 'fail'}">${passed ? '✅ PASSED' : '❌ FAILED'}</div>
        <div class="quiz-result-detail">${scorePct.toFixed(0)}% — ${passed ? 'You passed the test!' : `Need ${test.pass_percent || 70}% to pass`}</div>
        <div class="quiz-result-xp">+${result.xp_awarded || 0} XP earned</div>
      </div>`;

    // Show answers with correct/wrong highlighting
    for (let i = 0; i < questions.length; i++) {
      const q = questions[i];
      const selectedIdx = (result.user_answers && result.user_answers[i] != null) ? result.user_answers[i] : -1;
      const correctIdx = (result.correct_answers && result.correct_answers[i] != null) ? result.correct_answers[i] : -1;
      const isCorrect = selectedIdx === correctIdx;

      html += `
        <div class="quiz-question">
          <div class="quiz-question-header">
            <span class="quiz-question-number">${i + 1}</span>
            <span class="quiz-question-text">${escapeHtml(q.question || q.title || '')}</span>
            <span style="font-size:.8rem;font-weight:700;${isCorrect ? 'color:#4ade80' : 'color:#ef4444'}">${isCorrect ? '✅' : '❌'}</span>
          </div>
          <div class="quiz-options">`;

      for (let j = 0; j < (q.options || []).length; j++) {
        let cls = 'quiz-option disabled';
        if (j === correctIdx) cls += ' correct';
        else if (j === selectedIdx && j !== correctIdx) cls += ' wrong';
        const indicator = j === correctIdx ? '✓' : (j === selectedIdx ? '✗' : '');
        html += `
            <div class="${cls}">
              <span class="radio-indicator">${indicator}</span>
              <span>${escapeHtml(q.options[j])}</span>
            </div>`;
      }
      html += `</div></div>`;
    }
  } else {
    // Quiz interface — all questions at once
    html += `<form id="quizForm" onsubmit="handleSubmitTest(event, ${test.id})">`;

    // Hidden input to track selected answers
    html += `<input type="hidden" name="answers_json" id="answersJson" value="">`;

    for (let i = 0; i < questions.length; i++) {
      const q = questions[i];
      html += `
        <div class="quiz-question" data-qidx="${i}">
          <div class="quiz-question-header">
            <span class="quiz-question-number">${i + 1}</span>
            <span class="quiz-question-text">${escapeHtml(q.question || q.title || '')}</span>
          </div>
          <div class="quiz-options" data-qidx="${i}">`;

      for (let j = 0; j < (q.options || []).length; j++) {
        html += `
            <div class="quiz-option" data-qidx="${i}" data-oidx="${j}" onclick="selectQuizOption(this)">
              <span class="radio-indicator"></span>
              <span>${escapeHtml(q.options[j])}</span>
            </div>`;
      }
      html += `</div></div>`;
    }

    html += `
      <div style="margin-top:20px;text-align:center">
        <button type="submit" class="btn btn-primary">📝 Submit Test</button>
      </div>
    </form>`;
  }

  renderPage(html);
}

// Quiz option selection
window.selectQuizOption = function(el) {
  const qidx = el.dataset.qidx;
  // Deselect all options in this question
  const container = el.closest('.quiz-question');
  container.querySelectorAll('.quiz-option').forEach(opt => {
    opt.classList.remove('selected');
    opt.querySelector('.radio-indicator').textContent = '';
  });
  // Select clicked option
  el.classList.add('selected');
  el.querySelector('.radio-indicator').textContent = '●';
};

async function handleSubmitTest(event, testId) {
  event.preventDefault();

  const questions = document.querySelectorAll('.quiz-question');
  const answers = [];

  for (const q of questions) {
    const selected = q.querySelector('.quiz-option.selected');
    if (selected) {
      answers.push(parseInt(selected.dataset.oidx));
    } else {
      answers.push(-1); // No answer selected
    }
  }

  // Validate all answered
  if (answers.some(a => a === -1)) {
    notify('❌ Please answer all questions before submitting.');
    return;
  }

  const btn = event.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = '⏳ Submitting...';

  try {
    const result = await api.submitTest(testId, answers);
    state.testResult = result;
    // Update user
    if (result.user) {
      state.user = result.user;
      updateHUD();
    } else {
      state.user = await api.getUser();
      updateHUD();
    }
    // Re-render with result
    renderTestDetailHTML(state.currentTest, result);
    notify(`🎯 ${result.passed ? 'Passed!' : 'Failed'} — ${result.score}/${result.total}`);
  } catch (e) {
    notify('❌ ' + e.message);
    btn.disabled = false;
    btn.textContent = '📝 Submit Test';
  }
}

window.handleGenerateCourse = async function(event) {
  event.preventDefault();
  const form = event.target;

  const btn = document.getElementById('aiGenerateBtn');
  const status = document.getElementById('aiGenerateStatus');
  btn.disabled = true;
  btn.innerHTML = '<span class="generating">⚙️</span> Generating...';
  // AI acknowledgment — shows immediately so user knows system understood
  status.innerHTML = '<div style="text-align:center;padding:16px;color:#48cae4">' +

    '<div class="generating" style="margin-top:12px;font-size:.85rem;color:#888">⚙️ Preparing your course...</div>' +

            <textarea class="answer-input" id="questAnswer" name="answer" placeholder="Type your answer here..." rows="3" required></textarea>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <button type="submit" class="btn btn-primary" id="questSubmitBtn">📝 Submit Answer</button>
            <button type="button" class="btn btn-outline" onclick="handleQuestHint(${quest.id})">💡 Get Hint</button>
          </div>
        </form>
      </div>`;
  }

  html += `<div style="margin-top:16px"><button class="btn btn-ghost" onclick="navigate('/ai/${state.currentCourse ? state.currentCourse.id : ''}')">← Back to Course</button></div>`;
  renderPage(html);
}

window.handleQuestAnswer = async function(questId, event) {
  event.preventDefault();
  const form = event.target;
  const answer = form.answer.value.trim();
  if (!answer) return;

  const btn = document.getElementById('questSubmitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Submitting...';

  try {
    const res = await api.submitQuestAnswer(questId, answer);
    state._questFeedback = { correct: res.correct, feedback: res.feedback };
    // Update user
    if (res.user) {
      state.user = res.user;
      updateHUD();
    } else {
      state.user = await api.getUser();
      updateHUD();
    }
    // Update quest in state
    if (state.currentQuest) {
      state.currentQuest.completed = res.correct || state.currentQuest.completed;
      state.currentQuest.attempts = (state.currentQuest.attempts || 0) + 1;
    }
    // Show XP floating
    if (res.xp_earned > 0) {
      const rect = btn.getBoundingClientRect();
      showFloatingXp(rect.left, rect.top - 20, res.xp_earned);
    }
    // Re-render
    renderAIQuestDetailHTML(state.currentQuest);

    if (res.correct) {
      notify(`✅ +${res.xp_earned || 0} XP earned!`);
    }
    if (res.level_up) {
      const oldLevel = res.old_level || 1;
      const oldRank = res.old_rank || 'E';
      showLevelUp(res.user || state.user, oldLevel, oldRank);
    }
  } catch (e) {
    notify('❌ ' + e.message);
    btn.disabled = false;
    btn.textContent = '📝 Submit Answer';
  }
};

window.handleQuestHint = async function(questId) {
  const hintBtn = document.activeElement;
  if (hintBtn) hintBtn.disabled = true;

  try {
    const res = await api.getQuestHint(questId);
    state._questHint = res.hint || 'No hint available.';
    renderAIQuestDetailHTML(state.currentQuest);
  } catch (e) {
    notify('❌ ' + e.message);
    if (hintBtn) hintBtn.disabled = false;
  }
};

// ===================== HANDLERS =====================

async function handleQuestClick(el, event) {
  if (el.classList.contains('completed')) return;

  const id = el.dataset.questId;
  if (!id) return;

  // Optimistic UI
  const check = el.querySelector('.daily-check');
  check.classList.add('checked');
  check.textContent = '✓';
  el.classList.add('completed');

  // Show green glow
  el.classList.add('quest-complete-glow');
  setTimeout(() => el.classList.remove('quest-complete-glow'), 600);

  // Floating XP
  const xpText = el.querySelector('.daily-xp');
  const xpMatch = xpText ? xpText.textContent.match(/(\d+)/) : null;
  const xpVal = xpMatch ? parseInt(xpMatch[1]) : 10;

  if (event) {
    showFloatingXp(event.clientX, event.clientY, xpVal);
  } else {
    const rect = el.getBoundingClientRect();
    showFloatingXp(rect.right - 30, rect.top, xpVal);
  }

  try {
    const res = await api.completeQuest(id);
    // Check for level up
    if (res && res.level_up) {
      const oldLevel = res.old_level || 1;
      const oldRank = res.old_rank || 'E';
      showLevelUp(res.user || { level: res.new_level, xp: res.new_xp }, oldLevel, oldRank);
    }
    // Refresh user data
    if (res && res.user) {
      state.user = res.user;
    } else {
      state.user = await api.getUser();
    }
    updateHUD();
    // Refresh current page if on dashboard to update XP bar
    const hash = location.hash.slice(1) || '/';
    if (hash === '/') {
      refreshData();
    }
  } catch (e) {
    // Revert on error
    check.classList.remove('checked');
    check.textContent = '';
    el.classList.remove('completed');
    notify('❌ Failed to complete quest: ' + e.message);
  }
}

async function handleCreateGoal(event) {
  event.preventDefault();
  const form = event.target;
  const data = {
    title: form.title.value.trim(),
    description: form.description.value.trim(),
    timeframe: form.timeframe.value,
    deadline: form.deadline.value || null,
  };
  if (!data.title) return;

  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = '⏳ Creating...';

  try {
    const goal = await api.createGoal(data);
    notify('✅ Goal created!');
    navigate(`/goal/${goal.id}`);
  } catch (e) {
    notify('❌ Failed to create goal: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = '⚡ Create Goal';
  }
}

// ===================== NAVIGATION =====================

function navigate(path) {
  location.hash = '#' + path;
}

function getRoute(hash) {
  hash = hash.slice(1) || '/';
  // Match /ai/{courseId}/quest/{questId}
  const aiQuestMatch = hash.match(/^\/ai\/(\d+)\/quest\/(\d+)$/);
  if (aiQuestMatch) return { page: 'ai-quest', params: { courseId: aiQuestMatch[1], questId: aiQuestMatch[2] } };
  // Match /ai/{id}
  const aiCourseMatch = hash.match(/^\/ai\/(\d+)$/);
  if (aiCourseMatch) return { page: 'ai-course', params: { id: aiCourseMatch[1] } };
  // Match /ai/new
  if (hash === '/ai/new') return { page: 'ai-new', params: {} };
  // Match /goal/{id}
  const goalMatch = hash.match(/^\/goal\/(\d+)$/);
  if (goalMatch) return { page: 'goal', params: { id: goalMatch[1] } };
  // Match /materials/{id}
  const matMatch = hash.match(/^\/materials\/(\d+)$/);
  if (matMatch) return { page: 'material-detail', params: { id: matMatch[1] } };
  // Match /tests/{id}
  const testMatch = hash.match(/^\/tests\/(\d+)$/);
  if (testMatch) return { page: 'test-detail', params: { id: testMatch[1] } };
  // Match other pages
  const pages = {
    '/': 'tutor',
    '/tutor': 'tutor',
    '/dashboard': 'dashboard',
    '/goals': 'goals',
    '/create': 'create-redirect',
    '/achievements': 'achievements',
    '/materials': 'materials',
    '/tests': 'tests',
    '/assignments': 'assignments',
    '/ai': 'ai-courses',
  };
  return { page: pages[hash] || 'tutor', params: {} };
}

function updateHUD() {
  const { user } = state;
  if (!user) return;
  const { level } = getXpProgress(user.xp);
  const rank = getRank(user.xp);
  const title = RANK_TITLES[rank] || 'Unknown';

  document.getElementById('hudAvatar').textContent = user.avatar || '🛰️';
  document.getElementById('hudLevel').textContent = `Lv.${level}`;
  document.getElementById('hudRank').textContent = rank;
  document.getElementById('hudRank').className = `rank-badge rank-${rank} sm`;
  document.getElementById('hudTitle').textContent = user.display_name || title;
  document.getElementById('hudStreakCount').textContent = user.streak || 0;
}

function updateBottomNav() {
  const hash = location.hash.slice(1) || '/';
  document.querySelectorAll('.bottom-nav a').forEach(a => {
    const href = a.getAttribute('href').slice(1); // remove #
    // Highlight if exact match or if we're on a detail page whose parent matches
    const isDetail = (href === '/materials' && hash.startsWith('/materials')) ||
                     (href === '/tests' && hash.startsWith('/tests')) ||
                     (href === '/assignments' && hash.startsWith('/assignments')) ||
                     (href === '/ai' && hash.startsWith('/ai'));
    a.classList.toggle('active', href === hash || isDetail);
  });
}

// ===================== TIME HELPERS =====================

function timeRemaining(dateStr) {
  if (!dateStr) return '';
  const now = new Date();
  const target = new Date(dateStr);
  const diff = target - now;
  if (diff <= 0) return 'Overdue';

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

  if (days > 30) return `${Math.floor(days / 30)}mo left`;
  if (days > 0) return `${days}d ${hours}h left`;
  if (hours > 0) return `${hours}h left`;
  return '< 1h left';
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const now = new Date();
  const d = new Date(dateStr);
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  if (diff < 2592000) return `${Math.floor(diff / 86400)}d ago`;
  return `${Math.floor(diff / 2592000)}mo ago`;
}

// ===================== ROUTER =====================

async function router() {
  const hash = location.hash || '#/';
  const route = getRoute(hash);

  updateBottomNav();

  try {
    switch (route.page) {
      case 'tutor':
        await renderTutor();
        break;
      case 'dashboard':
        await refreshData();
        renderDashboard();
        break;
      case 'goals':
        state.goals = await api.getGoals();
        renderGoals();
        break;
      case 'goal':
        await renderGoalDetail(route.params.id);
        break;
      case 'create-redirect':
        navigate('/ai/new');
        break;
      case 'create':
        navigate('/ai/new');
        break;
      case 'achievements':
        state.achievements = await api.getAchievements();
        renderAchievements();
        break;
      case 'materials':
        state.materials = await api.getMaterials();
        renderMaterials();
        break;
      case 'material-detail':
        await renderMaterialDetail(route.params.id);
        break;
      case 'tests':
        state.tests = await api.getTests();
        renderTests();
        break;
      case 'test-detail':
        await renderTestDetail(route.params.id);
        break;
      case 'assignments':
        state.assignments = await api.getAssignments();
        renderAssignments();
        break;
      case 'ai-courses':
        state.courses = await api.getCourses();
        renderAICourses();
        break;
      case 'ai-new':
        renderAINew();
        break;
      case 'ai-course':
        await renderAICourseDetail(route.params.id);
        break;
      case 'ai-quest':
        await renderAIQuestDetail(route.params.courseId, route.params.questId);
        break;
      default:
        navigate('/');
    }
    updateHUD();
  } catch (e) {
    renderPage(`<div class="error-msg">❌ Error: ${escapeHtml(e.message)}</div>`);
  }
}

async function refreshData() {
  try {
    const [user, goals, daily, history, materials, tests, assignments] = await Promise.all([
      api.getUser(),
      api.getGoals(),
      api.getDaily(),
      api.getHistory(),
      api.getMaterials(),
      api.getTests(),
      api.getAssignments(),
    ]);
    state.user = user;
    state.goals = goals;
    state.daily = daily;
    state.history = history;
    state.materials = materials;
    state.tests = tests;
    state.assignments = assignments;
  } catch (e) {
    console.error('Refresh failed:', e);
    // Don't overwrite existing state on refresh failure
  }
}

// ===================== WELCOME / AUTH SCREEN =====================

let authMode = 'login';   // 'login' | 'register'
const AVATARS = ['🛰️','🌌','⚛️','🔭','🧠','🪐','✨','🧬','📡','🌠'];
let chosenAvatar = AVATARS[0];

const FLOAT_EQUATIONS = ['∂ψ/∂t = Ĥψ', '∮ E·dl = -dΦ/dt', 'eⁱᵖ + 1 = 0', '∇²φ = ρ/ε₀',
  '⟨x|p⟩ = eⁱˣᵖ/ℏ', '∫ e^(-x²) dx = √π', 'Rμν - ½Rgμν = 8πTμν', 'ΔxΔp ≥ ℏ/2'];

function showWelcome() {
  document.body.classList.add('welcome-active');
  document.getElementById('hud').style.display = 'none';
  document.querySelector('.bottom-nav').style.display = 'none';
  renderWelcome();
  startStarfield();
}

function renderWelcome() {
  const isLogin = authMode === 'login';
  const eqs = FLOAT_EQUATIONS.map((e, i) =>
    `<span class="float-eq" style="left:${(i * 13 + 5) % 90}%;animation-delay:${i * 1.7}s;animation-duration:${16 + (i % 5) * 4}s">${e}</span>`
  ).join('');

  const avatarPicker = isLogin ? '' : `
    <div class="avatar-picker">
      ${AVATARS.map(a => `<button type="button" class="avatar-opt ${a === chosenAvatar ? 'sel' : ''}" onclick="pickAvatar('${a}')">${a}</button>`).join('')}
    </div>`;

  const html = `
    <canvas id="starfield"></canvas>
    <div class="float-eqs">${eqs}</div>
    <div class="welcome-panel glass-cosmic">
      <div class="brand-orb"></div>
      <h1 class="brand-title">iQmaxer</h1>
      <p class="brand-tag">An AI that teaches you the hard things — quantum physics, higher math — one step at a time.</p>
      <div class="auth-toggle">
        <button class="${isLogin ? 'on' : ''}" onclick="setAuthMode('login')">Log in</button>
        <button class="${!isLogin ? 'on' : ''}" onclick="setAuthMode('register')">Register</button>
      </div>
      <form id="authForm" onsubmit="return submitAuth(event)">
        ${isLogin ? '' : '<input class="auth-input" id="au_display" placeholder="Display name (optional)" autocomplete="name">'}
        <input class="auth-input" id="au_user" placeholder="Username" autocomplete="username" required>
        <input class="auth-input" id="au_pass" type="password" placeholder="Password" autocomplete="${isLogin ? 'current-password' : 'new-password'}" required>
        ${avatarPicker}
        <div class="auth-err" id="au_err"></div>
        <button class="btn btn-primary auth-submit" type="submit">${isLogin ? 'Enter' : 'Create account'}</button>
      </form>
    </div>`;
  document.getElementById('app').innerHTML = html;
  const u = document.getElementById('au_user');
  if (u) u.focus();
}

function setAuthMode(mode) { authMode = mode; renderWelcome(); }
function pickAvatar(a) { chosenAvatar = a; renderWelcome(); }

async function submitAuth(e) {
  e.preventDefault();
  const errEl = document.getElementById('au_err');
  errEl.textContent = '';
  const username = document.getElementById('au_user').value.trim();
  const password = document.getElementById('au_pass').value;
  const btn = document.querySelector('.auth-submit');
  btn.disabled = true; btn.textContent = '…';
  try {
    let res;
    if (authMode === 'login') {
      res = await api.login({ username, password });
    } else {
      const display_name = (document.getElementById('au_display') || {}).value || '';
      res = await api.register({ username, password, display_name, avatar: chosenAvatar });
    }
    setToken(res.token);
    state.user = res.user;
    stopStarfield();
    await enterApp();
  } catch (err) {
    errEl.textContent = err.message || 'Something went wrong';
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? 'Enter' : 'Create account';
  }
  return false;
}

async function logout() {
  try { await api.logout(); } catch {}
  setToken(null);
  state.user = null;
  state.currentTutor = null;
  state.tutorSessions = [];
  showWelcome();
}

// ----- Starfield canvas -----
let _starAnim = null;
function startStarfield() {
  const canvas = document.getElementById('starfield');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.min(140, Math.floor((canvas.width * canvas.height) / 12000));
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.6 + 0.3,
      a: Math.random() * 0.6 + 0.2,
      tw: Math.random() * 0.02 + 0.005,
      dy: Math.random() * 0.15 + 0.02,
    }));
  }
  resize();
  window.addEventListener('resize', resize);
  let t = 0;
  function frame() {
    t += 1;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      s.y += s.dy; if (s.y > canvas.height) s.y = 0;
      const alpha = s.a + Math.sin(t * s.tw) * 0.25;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180,170,255,${Math.max(0.05, alpha)})`;
      ctx.fill();
    }
    _starAnim = requestAnimationFrame(frame);
  }
  if (!document.hidden) frame();
}
function stopStarfield() {
  if (_starAnim) { cancelAnimationFrame(_starAnim); _starAnim = null; }
}

// ===================== INIT =====================

async function init() {
  // No token? Straight to the welcome screen.
  if (!getToken()) { showWelcome(); return; }
  // Validate the token and load the user.
  try {
    state.user = await api.me();
  } catch (e) {
    showWelcome();
    return;
  }
  enterApp();
}

// Reveal the app chrome (HUD + nav) and route to the current page.
async function enterApp() {
  document.body.classList.remove('welcome-active');
  document.getElementById('hud').style.display = '';
  document.querySelector('.bottom-nav').style.display = '';
  updateHUD();
  if (!location.hash || location.hash === '#') location.hash = '#/';
  await router();
}

// Event listeners
window.addEventListener('hashchange', () => { if (getToken() && state.user) router(); });
window.addEventListener('DOMContentLoaded', init);

// Handle page already loaded
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  init();
}
